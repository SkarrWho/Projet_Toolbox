<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Résultats du scan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-dark text-white">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-10">
                <div class="card bg-primary" style="background-color: #007BFF !important;">
                    <div class="card-header text-center">
                        <h2>Résultats du scan Nmap</h2>
                        <a href="/" class="btn btn-sm btn-dark mt-2">Retour à l'accueil</a>
                    </div>
                    <div class="card-body">
                        <div class="mb-4">
                            <h4>Informations</h4>
                            <p><strong>Cible:</strong> <span id="targetInfo">{{ target }}</span></p>
                            <p><strong>Type de scan:</strong> 
                                <span id="scanTypeInfo">
                                    {% if scan_type == 'top' %}
                                        Top 1000 ports
                                    {% else %}
                                        Ports personnalisés ({{ ports }})
                                    {% endif %}
                                </span>
                            </p>
                            <div class="d-flex justify-content-between align-items-center">
                                <p><strong>Statut:</strong> <span id="scanStatus">En attente...</span></p>
                                <div class="spinner-border text-light" role="status" id="scanSpinner">
                                    <span class="visually-hidden">Scanning...</span>
                                </div>
                            </div>
                        </div>
                        
                        <div class="bg-white text-dark p-3 rounded" id="resultsContainer" style="min-height: 300px;">
                            <div id="scanResults">
                                <p class="text-center">Le scan va démarrer automatiquement...</p>
                            </div>
                        </div>
                        
                        <div class="text-center mt-4">
                            <a href="/nmap-scan" class="btn btn-dark text-white">Nouveau scan</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Récupère la cible (IP ou domaine ou les deux)
            const target = '{{ target }}';
            const scanType = '{{ scan_type }}';
            const ports = '{{ ports }}';
            const resultsContainer = document.getElementById('scanResults');
            const scanStatus = document.getElementById('scanStatus');
            const scanSpinner = document.getElementById('scanSpinner');
            
            // Start the scan
            startScan(target, scanType, ports);
            
            async function startScan(target, scanType, ports) {
                scanStatus.textContent = 'Scan en cours...';
                scanSpinner.style.display = 'inline-block';
                
                try {
                    const response = await fetch('/scan', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            target: target,
                            scan_type: scanType,
                            ports: ports
                        })
                    });
                    
                    const data = await response.json();
                    
                    if (response.ok) {
                        displayResults(data.results);
                        scanStatus.textContent = 'Terminé';
                        scanStatus.classList.add('text-success');
                    } else {
                        displayError(data.error || 'Une erreur s\'est produite');
                        scanStatus.textContent = 'Échec';
                        scanStatus.classList.add('text-danger');
                    }
                } catch (error) {
                    displayError('Erreur de connexion: ' + error.message);
                    scanStatus.textContent = 'Échec';
                    scanStatus.classList.add('text-danger');
                } finally {
                    scanSpinner.style.display = 'none';
                }
            }
            
            function displayResults(results) {
                if (!results || results.length === 0) {
                    resultsContainer.innerHTML = '<p class="text-center">Aucun résultat trouvé.</p>';
                    return;
                }
                
                let html = '';
                
                results.forEach(host => {
                    html += `<div class="mb-4">`;
                    html += `<h4>${host.host} ${host.hostname ? '(' + host.hostname + ')' : ''}</h4>`;
                    html += `<p>État: <span class="badge ${host.state === 'up' ? 'bg-success' : 'bg-danger'}">${host.state}</span></p>`;
                    
                    if (host.ports && host.ports.length > 0) {
                        html += `<table class="table table-striped table-bordered">`;
                        html += `<thead><tr><th>Port</th><th>État</th><th>Service</th><th>Version</th></tr></thead>`;
                        html += `<tbody>`;
                        
                        host.ports.forEach(port => {
                            html += `<tr>`;
                            html += `<td>${port.port}</td>`;
                            html += `<td><span class="badge ${port.state === 'open' ? 'bg-success' : 'bg-danger'}">${port.state}</span></td>`;
                            html += `<td>${port.service || 'N/A'}</td>`;
                            html += `<td>${port.version || 'N/A'}</td>`;
                            html += `</tr>`;
                        });
                        
                        html += `</tbody></table>`;
                    } else {
                        html += `<p>Aucun port détecté.</p>`;
                    }
                    
                    html += `</div>`;
                });
                
                resultsContainer.innerHTML = html;
            }
            
            function displayError(message) {
                resultsContainer.innerHTML = `<div class="alert alert-danger">${message}</div>`;
            }
        });
    </script>
</body>
</html>
