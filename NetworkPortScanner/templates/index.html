<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner de Ports</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-dark text-white d-flex align-items-center justify-content-center vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card bg-primary" style="background-color: #007BFF !important;">
                    <div class="card-header text-center">
                        <h2>Scanner de Ports Nmap</h2>
                        <a href="/" class="btn btn-sm btn-dark mt-2">Retour à l'accueil</a>
                    </div>
                    <div class="card-body">
                        <form id="scanForm" action="/resultats" method="GET">
                            <div id="ipField" class="mb-3">
                                <label for="ip" class="form-label">Adresse IP</label>
                                <input type="text" class="form-control bg-dark text-white" id="ip" name="ip" placeholder="Ex: 192.168.1.1">
                            </div>
                            
                            <div id="domainField" class="mb-3">
                                <label for="domain" class="form-label">Nom de domaine</label>
                                <input type="text" class="form-control bg-dark text-white" id="domain" name="domain" placeholder="Ex: example.com">
                            </div>
                            
                            <div class="mb-3">
                                <label for="scanType" class="form-label">Type de scan</label>
                                <select id="scanType" name="type" class="form-select bg-dark text-white">
                                    <option value="top">Top 1000 ports</option>
                                    <option value="custom">Ports personnalisés</option>
                                </select>
                            </div>
                            
                            <div id="customPortsField" class="mb-3 d-none">
                                <label for="ports" class="form-label">Liste des ports</label>
                                <textarea class="form-control bg-dark text-white" id="ports" name="ports" placeholder="Ex: 22,80,443"></textarea>
                                <small class="form-text text-light">Séparez les numéros de port par des virgules</small>
                            </div>
                            
                            <div class="text-center">
                                <button type="submit" id="startScanBtn" class="btn btn-dark text-white" disabled>Démarrer le scan</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
